name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build SchoolApp/SchoolApp.sln --configuration Release
      - name: Run domain checks
        run: dotnet run --project SchoolApp/SchoolLibrary.Checks/SchoolLibrary.Checks.csproj --configuration Release
